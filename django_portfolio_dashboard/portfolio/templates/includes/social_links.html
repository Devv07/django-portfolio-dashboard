<div class="social-links">
    {% if settings.github_link %}
        <a href="{{ settings.github_link }}" target="_blank" rel="noopener"><i class="fab fa-github"></i></a>
    {% endif %}
    {% if settings.linkedin_link %}
        <a href="{{ settings.linkedin_link }}" target="_blank" rel="noopener"><i class="fab fa-linkedin-in"></i></a>
    {% endif %}
    {% if settings.twitter_link %}
        <a href="{{ settings.twitter_link }}" target="_blank" rel="noopener"><i class="fab fa-twitter"></i></a>
    {% endif %}
    {% if settings.instagram_link %}
        <a href="{{ settings.instagram_link }}" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
    {% endif %}
</div>
